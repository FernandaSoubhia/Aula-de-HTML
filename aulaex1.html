<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login | Fiap</title>
        <link rel="shortcut icon" href="https://onetclub.com.br/wp-content/uploads/2019/04/fiap.jpg" type="image/x-icon">
    </head>
    <body>
        <form action="">
            <h1>Login</h1>
            <label for="">Usuario</label>
            <input type="text" placeholder="Digite o seu usuario" id="usuario">
 
            <label for="">Senha</label>
            <input type="password" placeholder="Digite a senha" id="senha">
            <a href="https://www.fiap.com.br/colegio/">esqueci a senha</a>
            <button onclick="login()">Entrar</button>
        </form>
        <script>
            function login(){
                usuario = document.getElementById("usuario").value;
                senha = document.getElementById("senha").value;
                if (usuario == "admin" && senha == "123"){
                    alert('logado mlk !!');
                }
                else{
                    alert('xii errou alguma coisa ai !!')
                }
 
            }
        </script>
    </body>
</html>
